server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/accounts,/api/v1/admin/accounts/**

        - id: document-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/documents,/api/v1/documents/**,/api/v1/admin/documents,/api/v1/admin/documents/**

        - id: signing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/signing-requests,/api/v1/signing-requests/**,/api/v1/admin/signing-requests,/api/v1/admin/signing-requests/**

        - id: stepup-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/step-up,/api/v1/step-up/**,/api/v1/admin/step-up/**,/api/v1/internal/step-up/** 

        - id: certification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/certificate-requests,/api/v1/certificate-requests/**,/api/v1/certificate-renewal-requests/**,/api/v1/certificates,/api/v1/certificates/**,/api/v1/admin/certificate-requests,/api/v1/admin/certificate-requests/**,/api/v1/admin/certificate-renewal-requests/**,/api/v1/admin/certificates,/api/v1/admin/certificates/**

        - id: verification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/verifications,/api/v1/verifications/**

        - id: audit-service
          uri: http://localhost:8088
          predicates:
            - Path=/internal/v1/audit,/internal/v1/audit/**,/api/v1/admin/audit,/api/v1/admin/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
