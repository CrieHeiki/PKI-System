server:
  port: 8087

spring:
  application:
    name: verification-service

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://localhost:5432/verification_db?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

services:
  certification-service:
    base-url: http://localhost:8083
  signing-workflow-service:
    base-url: http://localhost:8084
  audit-service:
    base-url: http://localhost:8088

app:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: ct556-documents

logging:
  level:
    root: INFO
    com.ct556.verification_service: DEBUG
