server:
  port: 8081

spring:
  application:
    name: account-service
  security:
    user:
      name: admin
      password: 123456

  datasource:
    url: jdbc:postgresql://localhost:5432/account_db?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      [hibernate.format_sql]: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  audit-service:
    base-url: http://localhost:8088

jwt:
  secret: 7s8t1vImBp6aCJ4ePeChxrnRB2IzsQLF8kRn2RgS4dY=
  access-token-expiration-minutes: 60
