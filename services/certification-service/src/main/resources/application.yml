server:
  port: 8083

spring:
  application:
    name: certification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/certification_db?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Ho_Chi_Minh

vault:
  url: http://localhost:8200
  token: "YOUR_VAULT_ROOT_TOKEN_HERE"
  mount-path: pki
  issue-role: internal-users
  transit-mount-path: transit
  transit-key-prefix: cert
  connect-timeout: 5s
  read-timeout: 20s

jwt:
  secret: 7s8t1vImBp6aCJ4ePeChxrnRB2IzsQLF8kRn2RgS4dY=
  clock-skew-seconds: 60

logging:
  level:
    root: INFO
    com.ct556.certification_service: DEBUG

services:
  audit-service:
    base-url: http://localhost:8088
