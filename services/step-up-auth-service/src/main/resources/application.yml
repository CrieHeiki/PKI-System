server:
  port: 8085

spring:
  application:
    name: step-up-auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/stepup_db?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  audit-service:
    base-url: http://localhost:8088
  account-service:
    base-url: http://localhost:8081

jwt:
  secret: 7s8t1vImBp6aCJ4ePeChxrnRB2IzsQLF8kRn2RgS4dY=
  clock-skew-seconds: 60

app:
  step-up:
    challenge-ttl-seconds: 300
    proof-ttl-seconds: 600
    enrollment-ticket-ttl-seconds: 1800
    max-attempts: 5
    challenge-code-length: 6
    demo-return-code: true
    webauthn:
      rp-id: localhost
      rp-name: CT556 Internal PKI
      allowed-origins:
        - http://localhost:5173
        - http://localhost:8080
      timeout-millis: 60000
