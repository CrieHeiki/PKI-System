server:
  port: 8082

spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://localhost:5432/document_db?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

services:
  audit-service:
    base-url: http://localhost:8088

app:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: ct556-documents

  security:
    jwt:
      secret: 7s8t1vImBp6aCJ4ePeChxrnRB2IzsQLF8kRn2RgS4dY=
      secret-base64-encoded: false

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
